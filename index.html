<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wayfinder — Live Friend Location Tracker</title>
    <meta
      name="description"
      content="Real-time interactive Google Map for sharing live GPS location, tracking friends' movements, and sending Google Maps location email alerts."
    />
    <meta property="og:title" content="Wayfinder — Live Friend Location Tracker" />
    <meta
      property="og:description"
      content="Real-time interactive Google Map for sharing live GPS location, tracking friends' movements, and sending Google Maps location email alerts."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased">
    <div id="root"></div>
    <noscript>
      <div style="font-family:sans-serif;padding:32px;text-align:center;color:#0f172a;">
        JavaScript is required to run Wayfinder.
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      window.setTimeout(function () {
        var root = document.getElementById('root');
        if (root && root.children.length === 0) {
          root.innerHTML =
            '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;font-family:system-ui,sans-serif;background:#f8fafc;color:#0f172a;">' +
            '<div style="max-width:460px;background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:24px;box-shadow:0 1px 3px rgba(0,0,0,.06);">' +
            '<h1 style="margin:0 0 8px;font-size:18px;font-weight:700;">App bundle did not load</h1>' +
            '<p style="margin:0;font-size:14px;line-height:1.5;color:#475569;">' +
            'If you uploaded this site to static hosting (such as InfinityFree), make sure you ran <code>npm run build</code> and uploaded the contents of the <code>dist/</code> folder rather than the raw source files.' +
            '</p></div></div>';
        }
      }, 4500);
    </script>
  </body>
</html>
